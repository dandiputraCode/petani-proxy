[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-proxy-harvester"
version = "1.0.0"
authors = [
  { name="Luthfi", email="contact@itzluthfi.dev" },
]
description = "High-speed multi-protocol proxy scraper, validator, rotating gateway & REST API"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
fast = [
    "curl_cffi>=0.7.0",
]

[project.scripts]
omni-proxy = "main:main"

[project.urls]
"Homepage" = "https://github.com/itzluthfi/omni-proxy-harvester"
"Bug Tracker" = "https://github.com/itzluthfi/omni-proxy-harvester/issues"
